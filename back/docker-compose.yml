services:
  db:
    image: mysql:8.1
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fastapi_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -lc "
      echo 'Creating topics...' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic chat.global --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic chat.red --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic chat.blue --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic battle.commands --partitions 1 --replication-factor 1 &&
      echo 'Topics ready.'"

  auth_service:
    build: ./auth_service
    container_name: auth_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: fastapi_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  teams_service:
    build: ./teams_service
    container_name: teams_app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: fastapi_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONUNBUFFERED: "1"
    restart: on-failure

  pokemon-service:
    build:
      context: ./pokemon_service # Ajuste ce chemin si ton docker-compose est ailleurs
      dockerfile: Dockerfile
    container_name: pokemon-service
    ports:
      - "8002:8000"
    # Le volume permet le "hot-reload" : tes modifications de code se répercutent sans rebuild
    volumes:
      - ./pokemon_service/app:/code/app
    environment:
      - PYTHONUNBUFFERED=1 # Permet de voir les logs Python en temps réel dans la console
      
  battle_engine:
    build: ./battle_engine
    container_name: battle_engine
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONUNBUFFERED: "1"
    restart: on-failure
volumes:
  db_data:
