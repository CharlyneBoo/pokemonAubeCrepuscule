  logic.py: "TYPE_MAP = {\n    \"normal\": {\"rock\": 0.5, \"ghost\": 0, \"steel\": 0.5},\n    \"fire\": {\"fire\": 0.5, \"water\": 0.5, \"grass\": 2, \"ice\": 2, \"bug\": 2, \"rock\": 0.5, \"dragon\": 0.5, \"steel\": 2},\n    \"water\": {\"fire\": 2, \"water\": 0.5, \"grass\": 0.5, \"ground\": 2, \"rock\": 2, \"dragon\": 0.5},\n    \"grass\": {\"fire\": 0.5, \"water\": 2, \"grass\": 0.5, \"poison\": 0.5, \"ground\": 2, \"flying\": 0.5, \"bug\": 0.5, \"rock\": 2, \"dragon\": 0.5, \"steel\": 0.5},\n    \"electric\": {\"water\": 2, \"grass\": 0.5, \"electric\": 0.5, \"ground\": 0, \"flying\": 2, \"dragon\": 0.5},\n    \"ice\": {\"fire\": 0.5, \"water\": 0.5, \"grass\": 2, \"ice\": 0.5, \"ground\": 2, \"flying\": 2, \"dragon\": 2, \"steel\": 0.5},\n    \"fighting\": {\"normal\": 2, \"ice\": 2, \"poison\": 0.5, \"flying\": 0.5, \"psychic\": 0.5, \"bug\": 0.5, \"rock\": 2, \"ghost\": 0, \"dark\": 2, \"steel\": 2, \"fairy\": 0.5},\n    \"poison\": {\"grass\": 2, \"poison\": 0.5, \"ground\": 0.5, \"rock\": 0.5, \"ghost\": 0.5, \"steel\": 0, \"fairy\": 2},\n    \"ground\": {\"fire\": 2, \"grass\": 0.5, \"electric\": 2, \"poison\": 2, \"flying\": 0, \"bug\": 0.5, \"rock\": 2, \"steel\": 2},\n    \"flying\": {\"grass\": 2, \"electric\": 0.5, \"fighting\": 2, \"bug\": 2, \"rock\": 0.5, \"steel\": 0.5},\n    \"psychic\": {\"fighting\": 2, \"poison\": 2, \"psychic\": 0.5, \"dark\": 0, \"steel\": 0.5},\n    \"bug\": {\"fire\": 0.5, \"grass\": 2, \"fighting\": 0.5, \"poison\": 0.5, \"flying\": 0.5, \"psychic\": 2, \"ghost\": 0.5, \"dark\": 2, \"steel\": 0.5, \"fairy\": 0.5},\n    \"rock\": {\"fire\": 2, \"ice\": 2, \"fighting\": 0.5, \"ground\": 0.5, \"flying\": 2, \"bug\": 2, \"steel\": 0.5},\n    \"ghost\": {\"normal\": 0, \"psychic\": 2, \"ghost\": 2, \"dark\": 0.5, \"steel\": 0.5},\n    \"dragon\": {\"dragon\": 2, \"steel\": 0.5, \"fairy\": 0},\n    \"dark\": {\"fighting\": 0.5, \"psychic\": 2, \"ghost\": 2, \"dark\": 0.5, \"steel\": 0.5, \"fairy\": 0.5},\n    \"steel\": {\"fire\": 0.5, \"water\": 0.5, \"ice\": 2, \"rock\": 2, \"steel\": 0.5, \"fairy\": 2},\n    \"fairy\": {\"fire\": 0.5, \"fighting\": 2, \"poison\": 0.5, \"dragon\": 2, \"dark\": 2, \"steel\": 0.5}\n}\n\ndef get_mult(atk, dfs):\n    if not atk or not dfs: return 1.0\n    return TYPE_MAP.get(atk, {}).get(dfs, 1.0)\n\ndef calculate_advantages(pk_attaque, pk_defense):\n    # Formule : F(A) = 1*(W/Y)*(W/Z) + 1*(X/Y)*(X/Z) \n    w, x = pk_attaque['types'][0], (pk_attaque['types'][1] if len(pk_attaque['types']) > 1 else None)\n    y, z = pk_defense['types'][0], (pk_defense['types'][1] if len(pk_defense['types']) > 1 else None)\n\n    f_attaque = (1 * get_mult(w, y) * get_mult(w, z)) + (1 * get_mult(x, y) * get_mult(x, z))\n    f_defense = (1 * get_mult(y, w) * get_mult(y, x)) + (1 * get_mult(z, w) * get_mult(z, x))\n    \n    return f_attaque, f_defense"
  main.py: "from fastapi import FastAPI\nfrom pydantic import BaseModel\nfrom .logic import calculate_advantages\nimport random\nfrom fastapi.middleware.cors import CORSMiddleware\n\n\napp = FastAPI(title=\"Duel Logic Service\")\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origin_regex=\".*\",  \n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\nclass BattleRequest(BaseModel):\n    turn: int = 0\n    red_player: str = \"Joueur Rouge\" \n    blue_player: str = \"Joueur Bleu\" \n    red_action: str = \"inconnue\"\n    blue_action: str = \"inconnue\"\n    red_pokemon: dict\n    blue_pokemon: dict\n\nclass DuelService:\n   def resolve_turn(self, turn: int, red_player: str, blue_player: str, red_action: str, blue_action: str, red_pokemon: dict, blue_pokemon: dict):\n        f_red, f_blue = calculate_advantages(red_pokemon, blue_pokemon)\n        \n        red_name = red_pokemon.get('name', 'Pokémon Rouge')\n        blue_name = blue_pokemon.get('name', 'Pokémon Bleu')\n        \n        result = {\n            \"f_red\": f_red,\n            \"f_blue\": f_blue,\n            \"winner\": None,\n            \"message\": \"\"\n        }\n\n        message = f\" --- DÉBUT DU TOUR {turn} ---\\n\"\n        message += f\"\U0001F534 {red_player} a fait : {red_action.upper()}\\n\"\n        message += f\"\U0001F535 {blue_player} a fait : {blue_action.upper()}\\n\"\n        message += f\"⚔️ {red_name} (Points {f_red}) VS {blue_name} (Points {f_blue})\\n\"\n\n        if f_red > f_blue:\n            result[\"winner\"] = \"red\"\n            message += f\"\U0001F3C6 {red_name} l'emporte ! {blue_name} est mis KO !\"\n        elif f_blue > f_red:\n            result[\"winner\"] = \"blue\"\n            message += f\"\U0001F3C6 {blue_name} l'emporte ! {red_name} est mis KO !\"\n        else:\n            result[\"winner\"] = \"both\"\n            message += \"\U0001F91D Égalité ! Les deux Pokémon sont ko.\"\n            \n        result[\"message\"] = message\n        return result\n\n\nduel_logic = DuelService()\n\n@app.post(\"/resolve\")\nasync def resolve(request: BattleRequest):\n    return duel_logic.resolve_turn(\n        request.turn, \n        request.red_player,     \n        request.blue_player,   \n        request.red_action, \n        request.blue_action, \n        request.red_pokemon, \n        request.blue_pokemon\n    )\n\n@app.get(\"/generate-random-teams\")\ndef generate_random_teams():\n    ids_tires = random.sample(range(1, 1000), 12)\n    \n    return {\n        \"red_team_ids\": ids_tires[0:6],\n        \"blue_team_ids\": ids_tires[6:12],\n        \"red_active_index\": random.randint(0, 5),\n        \"blue_active_index\": random.randint(0, 5)\n    }"
