apiVersion: v1
data:
  main.py: "import os\nimport json\nimport asyncio\nfrom contextlib import asynccontextmanager\nfrom fastapi import FastAPI, Depends\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom sqlalchemy import create_engine, Column, Integer, String, Text, DateTime\nfrom sqlalchemy.orm import declarative_base, sessionmaker, Session\nfrom sqlalchemy.sql import func\nfrom aiokafka import AIOKafkaConsumer\n\nDB_USER = os.getenv(\"MYSQL_USER\", \"user\")\nDB_PASSWORD = os.getenv(\"MYSQL_PASSWORD\", \"password\")\nDB_HOST = os.getenv(\"MYSQL_HOST\", \"db\")\nDB_PORT = os.getenv(\"MYSQL_PORT\", \"3306\")\nDB_NAME = os.getenv(\"MYSQL_DATABASE\", \"fastapi_db\") \n\nDATABASE_URL = f\"mysql+mysqlconnector://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}\"\n\nengine = create_engine(DATABASE_URL)\nSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)\nBase = declarative_base()\n\nclass SystemLog(Base):\n    __tablename__ = \"system_logs\"\n    id = Column(Integer, primary_key=True, index=True, autoincrement=True)\n    timestamp = Column(DateTime, server_default=func.now())\n    service = Column(String(50))\n    message = Column(Text)\n\nBase.metadata.create_all(bind=engine)\n\ndef get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n\n\nKAFKA_BOOTSTRAP_SERVERS = os.getenv(\"KAFKA_BOOTSTRAP_SERVERS\", \"kafka-svc:9092\")\n\nasync def consume_system_logs():\n    consumer = AIOKafkaConsumer(\n        \"system.logs\",\n        bootstrap_servers=KAFKA_BOOTSTRAP_SERVERS,\n        group_id=\"log-service-group\",\n        auto_offset_reset=\"latest\"\n    )\n    await consumer.start()\n    print(\"[Log Service] Prêt et en écoute des logs système...\")\n    \n    try:\n        async for msg in consumer:\n            payload = json.loads(msg.value.decode(\"utf-8\"))\n            db = SessionLocal()\n            \n            new_log = SystemLog(\n                service=payload.get(\"service\", \"Inconnu\"),\n                message=payload.get(\"message\", \"\")\n            )\n            db.add(new_log)\n            db.commit()\n            db.close()\n            print(f\"[Log Service] Log enregistré : {payload.get('service')}\")\n    except Exception as e:\n        print(f\"Erreur Log Consumer : {e}\")\n    finally:\n        await consumer.stop()\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    # Lancement du consumer en tâche de fond\n    asyncio.create_task(consume_system_logs())\n    yield\n\napp = FastAPI(title=\"Log Service\", lifespan=lifespan)\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origin_regex=\".*\", \n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\n@app.get(\"/admin/logs\")\ndef get_logs(db: Session = Depends(get_db)):\n    # Renvoie les 50 derniers logs\n    return db.query(SystemLog).order_by(SystemLog.timestamp.desc()).limit(100).all()"
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: log-service
  name: log-service-cm0
