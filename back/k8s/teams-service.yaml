apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-service
  namespace: pokemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-service
  template:
    metadata:
      labels:
        app: teams-service
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox
        command: ['sh', '-c', 'until nc -z db 3306; do echo waiting for mysql; sleep 2; done']
      containers:
      - name: teams-service
        image: teams-service:latest
        imagePullPolicy: Never
        env:
        - name: MYSQL_HOST
          value: "db"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "fastapi_db"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: teams-service
  namespace: pokemon
spec:
  selector:
    app: teams-service
  ports:
  - port: 8001
    targetPort: 8000