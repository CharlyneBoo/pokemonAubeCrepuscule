<div class="duel-page" [ngClass]="myTeamColor">
  <div class="timer-header">
    <h2>Temps restant : {{ timer }}s</h2>
  </div>

  <div class="main-battle-area">
    <div class="sidebar opponent-sidebar">
      <div *ngFor="let p of opponentTeam" class="mini-slot">
        <img [src]="p.isRevealed ? p.iconUrl : 'assets/images/unknown_pokemon.png'" class="icon" />
      </div>
    </div>

    <div class="arena">
      <div class="active-pokemon red">
        <img *ngIf="activeRed" [src]="activeRed.spriteUrl" />
      </div>
      <div class="vs">VS</div>
      <div class="active-pokemon blue">
        <img *ngIf="activeBlue" [src]="activeBlue.spriteUrl" />
      </div>
    </div>

    <div class="sidebar player-sidebar">
      <div *ngFor="let p of myTeam" class="mini-slot">
        <button (click)="switchPokemon(p)" [disabled]="p.isKO || isGameOver">
          <img [src]="p.iconUrl" [class.ko-grayscale]="p.isKO" />
        </button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-stay" (click)="stay()">Stay</button>
    <button class="btn-forfeit" (click)="confirmForfeit()">Forfait</button>
  </div>

  <div class="chat-area">
    <div class="messages">
      <p *ngFor="let m of messages">
        <b>{{ m.user }}:</b> {{ m.text }}
      </p>
    </div>
  </div>
</div>
