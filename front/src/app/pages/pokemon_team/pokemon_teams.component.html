<div class="max-w-7xl mx-auto pt-6 px-4 md:px-0 flex justify-between items-start">
  <button (click)="naviguer('/home')" 
          class="flex items-center gap-2 bg-white/80 hover:bg-white text-[#311b5e] font-bold py-2 px-4 rounded-xl shadow-md transition-all hover:shadow-lg active:scale-95 group">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Retour
  </button>
</div>

<div class="max-w-7xl mx-auto flex justify-end">
  <img
    (click)="naviguer('/home')"
    class="deco-img w-32 md:w-48 h-auto object-contain opacity-90 hover:opacity-100 transition-opacity"
    src="/titre.png"
    alt="Logo"
  />
</div>
<div
  class="min-h-screen p-8 font-sans bg-cover bg-center bg-fixed transition-all duration-500"
  [style.background-image]="user.team_color === 'red' ? 'url(/redfond.png)' : 'url(/bluefond.png)'"
>
  <div
    class="max-w-4xl mx-auto flex items-center gap-6 mb-12 p-2 rounded-xl border-2 border-white shadow-sm"
    [ngClass]="user.team_color === 'red' ? 'bg-[#ff7171]' : 'bg-[#90a5ff]'"
  >
    <div
      class="w-32 h-32 aspect-square bg-white border-4 border-white shadow-md overflow-hidden rounded-xl flex-shrink-0"
    >
      <img
        [src]="user.avatar"
        class="w-full h-full object-contain drop-shadow-2xl transition-all"
      />
    </div>
    <p class="font-bold text-white text-2xl">
      {{ user.pseudo }}
    </p>
  </div>

  <div class="max-w-4xl mx-auto flex justify-between items-end mb-6">
    <h2
      class="text-3xl font-bold text-[#4b235e] border-b-4 pb-1"
      [ngClass]="user.team_color === 'red' ? 'border-[#db5151]' : 'border-[#6a4cef]'"
    >
      Mes Équipes
    </h2>
    <button
      (click)="creerNouvelleEquipe()"
      class="bg-[#4b235e] text-white px-6 py-2.5 rounded-lg font-bold hover:bg-gray-800 transition-colors shadow-lg flex items-center gap-2"
    >
      <span class="text-xl">+</span> Créer une équipe
    </button>
  </div>

  <div class="max-w-4xl mx-auto space-y-8">
    <div *ngFor="let team of teams" class="flex flex-col">
      <div class="flex items-center gap-4 mb-2">
        <h2 class="text-2xl font-bold text-[#4b235e]">{{ team.nom }}</h2>
        <button
          (click)="completerEquipe(team.id)"
          class="text-white text-xs font-bold px-4 py-1.5 rounded-md transition-colors shadow"
          [ngClass]="
            user.team_color === 'red'
              ? 'bg-[#8b1c1c] hover:bg-[#6b1515]'
              : 'bg-[#1b2f85] hover:bg-[#14256b]'
          "
        >
          Complete
        </button>
      </div>

      <div class="flex gap-4 items-stretch">
        <div
          class="flex-grow rounded-xl flex items-center justify-around p-2 min-h-[120px] shadow-lg relative overflow-hidden"
          [ngClass]="user.team_color === 'red' ? 'bg-[#cc2222]' : 'bg-[#2242c9]'"
        >
          <div
            class="absolute inset-0 opacity-10 flex justify-center items-center pointer-events-none"
          >
            <div class="w-48 h-48 border-8 border-white rounded-full"></div>
          </div>

          <div *ngFor="let slot of [0, 1, 2, 3, 4, 5]" class="relative w-20 h-20 group">
            <ng-container *ngIf="team.pokemons.length > slot">
              <img
                [src]="getImageUrl(team.pokemons[slot])"
                class="w-full h-full object-contain drop-shadow-md z-10 relative"
              />

              <div
                *ngIf="team.isEditing"
                (click)="retirerPokemon(team, slot)"
                class="absolute inset-0 bg-red-900/60 rounded-lg flex items-center justify-center z-20 cursor-pointer hover:bg-red-900/80 transition-colors"
              >
                <span class="absolute -top-2 -right-1 text-black text-xs">🗑️</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-8 w-8 text-black"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                  />
                </svg>
              </div>
            </ng-container>

            <ng-container *ngIf="team.pokemons.length <= slot">
              <div
                class="w-full h-full rounded-full bg-black/20 border-2 border-dashed border-white/30 flex items-center justify-center relative z-10"
              >
                <div
                  *ngIf="team.isEditing"
                  (click)="ajouterPokemon(team)"
                  class="absolute inset-0 cursor-pointer flex items-center justify-center rounded-full hover:bg-white/20 transition-colors"
                >
                  <span class="text-white text-3xl font-bold opacity-70">+</span>
                </div>
              </div>
            </ng-container>
          </div>
        </div>

        <div class="flex flex-col gap-2 w-24">
          <button
            (click)="toggleEdit(team)"
            class="text-white text-sm font-bold flex-1 rounded-lg transition-colors shadow"
            [ngClass]="
              user.team_color === 'red'
                ? 'bg-[#8b1c1c] hover:bg-[#6b1515]'
                : 'bg-[#1b2f85] hover:bg-[#14256b]'
            "
          >
            {{ team.isEditing ? 'Save' : 'Modify' }}
          </button>
          <button
            (click)="supprimerEquipe(team.id)"
            class="text-white text-sm font-bold flex-1 rounded-lg transition-colors shadow"
            [ngClass]="
              user.team_color === 'red'
                ? 'bg-[#8b1c1c] hover:bg-[#6b1515]'
                : 'bg-[#1b2f85] hover:bg-[#14256b]'
            "
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
